services:
  db:
    image: postgis/postgis:16-3.4
    container_name: prayer_api_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: prayer_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
